<!DOCTYPE html>
<html lang="zh-CN" style="background:#f8f9fa">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="darkreader-lock">
<meta name="night" content="force_light">
<meta name="color-scheme" content="light only">
<title>收纳管家</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f8f9fa;--card:#fff;--primary:#1f2937;--accent:#2563eb;--accent-hover:#1d4ed8;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.04)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#f8f9fa!important;color:#1f2937!important;font-family:Inter,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;min-height:100vh}
body{display:flex}
/* 左侧导航 */
.sidebar{width:200px;background:var(--card);border-right:1px solid var(--border);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:0}
.side-logo{padding:20px 20px 12px;font-size:18px;font-weight:700;color:var(--primary);letter-spacing:-.3px;border-bottom:1px solid var(--border);margin-bottom:8px}
.side-logo span{color:var(--accent)}
.side-btn{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;text-align:left;transition:all .12s;border-radius:0;position:relative}
.side-btn:hover{color:var(--primary);background:#f3f4f6}
.side-btn.act{color:var(--accent);background:#eff6ff;font-weight:600}
.side-btn.act::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.side-spacer{flex:1}
.side-foot{padding:12px 20px;font-size:11px;color:#bbb;border-top:1px solid var(--border)}
/* 内容 */
.main{flex:1;padding:28px 32px 40px;max-width:960px;overflow-y:auto;height:100vh}
.page{display:none}.page.act{display:block}
.hdr{margin-bottom:20px}.hdr h1{font-size:22px;font-weight:600;color:var(--primary);letter-spacing:-.4px}
.hdr .sub{font-size:13px;color:var(--muted);margin-top:2px}
/* 首页卡片 */
.r-sec{margin-bottom:16px}
.r-hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:15px;font-weight:600;color:var(--primary);cursor:pointer;user-select:none;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:8px}
.r-hdr .arr{font-size:10px;color:#bbb;transition:transform .2s;display:inline-block}
.r-hdr .arr.o{transform:rotate(90deg)}
.r-hdr .c{font-size:12px;color:var(--muted);font-weight:400;margin-left:auto}
.r-body{padding-left:0}.r-body.cl{display:none}
.s-hdr{font-size:13px;font-weight:500;color:var(--muted);padding:6px 0 4px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:6px;border:1px solid var(--border)}
.cd{padding:10px 14px 12px}
.ct{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bg{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:2px 10px;border-radius:12px;letter-spacing:.2px}
.vb{font-size:12px;color:var(--accent);font-weight:500;padding:3px 10px;background:#eff6ff;border-radius:6px;cursor:pointer;transition:all .12s}
.vb:hover{background:#dbeafe}
.dt{color:var(--muted);font-size:11px;margin-bottom:4px}
.il{list-style:none}.il li{padding:3px 0;font-size:13px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}
.il li:last-child{border-bottom:none}.il .c2{color:var(--muted);font-size:12px}
.nt{font-size:11px;color:var(--muted);margin-top:2px;font-style:italic}
/* 管理 */
.adm-con{margin-top:8px}
.adm-s{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card);margin-bottom:10px}
.adm-rh{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:#f9fafb}
.adm-rh .n{font-size:15px;font-weight:600;color:var(--primary)}
.adm-sh{padding:8px 14px 4px;display:flex;justify-content:space-between;align-items:center}
.adm-sh .n{font-size:13px;font-weight:500;color:#555}
.adm-b{padding:5px 0 5px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#555;border-bottom:1px solid var(--border)}
.adm-b:last-child{border-bottom:none}.adm-b .id{color:var(--accent);font-weight:600}
/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;border:none;cursor:pointer;color:#fff;transition:all .15s}
.btn-p{background:var(--accent)}.btn-p:hover{background:var(--accent-hover)}
.btn-g{background:#16a34a}.btn-r{background:#dc2626}.btn-gy{background:var(--muted)}.btn-o{background:#d97706}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-gh{background:none;color:var(--muted);border:1px solid var(--border);padding:5px 12px}
.btn-gh:hover{background:#f9fafb}
.btn-ic{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:none;cursor:pointer;font-size:15px;background:none;color:var(--muted);transition:all .12s}
.btn-ic:hover{background:#f3f4f6;color:var(--primary)}
.btn-ic.r:hover{background:#fef2f2;color:#dc2626}
.ac{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
/* 表单 */
.fg{margin-bottom:10px}
.fg label{display:block;font-size:12px;font-weight:500;color:#555;margin-bottom:4px}
.fg input,.fg textarea,.fg select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text)}
.fg textarea{min-height:50px;resize:vertical}
.fr{display:flex;gap:8px}.fr>*{flex:1}
/* 模态框 */
.md{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;background:rgba(0,0,0,.25);backdrop-filter:blur(2px)}
.md.show{display:flex;align-items:center;justify-content:center}
.mc{background:var(--card);border-radius:12px;padding:24px;width:92%;max-width:440px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.1)}
.mc h2{font-size:16px;margin-bottom:12px;color:var(--primary);font-weight:600}
/* 照片 */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.pg a{border-radius:6px;overflow:hidden;border:1px solid var(--border);background:var(--card);text-decoration:none;display:block;transition:all .12s}
.pg a:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(37,99,235,.1)}
.pg img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pg .pl{display:block;text-align:center;font-size:11px;color:#555;padding:3px 0}
.pi{border:2px solid transparent;border-radius:10px;padding:10px;margin:8px 0;display:none}
.pi.show{display:block}
.pi img{width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.pi .pc{display:inline-block;margin:6px 4px 0 0;padding:5px 14px;background:#f3f4f6;color:#555;border-radius:6px;font-size:12px;cursor:pointer}
.pi .pd{display:inline-block;margin:6px 0 0;padding:5px 14px;background:#fef2f2;color:#dc2626;border-radius:6px;font-size:12px;cursor:pointer}
.item-opt{padding:10px 12px;margin:4px 0;background:#f9fafb;border-radius:6px;cursor:pointer;font-size:14px;border:2px solid transparent;transition:all .12s}
.item-opt:hover{background:#eff6ff}.item-opt.sel{border-color:var(--accent);background:#eff6ff;font-weight:600}
/* 二维码 */
.qr-g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qr-i{background:var(--card);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.qr-i .ql{font-size:13px;font-weight:600;color:var(--primary)}
.qr-i .qs{font-size:11px;color:var(--muted)}
/* 设置 */
.st-c{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:10px}
.st-c .t{font-size:15px;font-weight:600;color:var(--primary);margin-bottom:2px}
.st-c .d{font-size:12px;color:var(--muted);margin-bottom:8px}
/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;background:#1f2937;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
/* 响应式 */
@media(max-width:720px){.sidebar{width:100%;height:48px;flex-direction:row;position:fixed;bottom:0;top:auto;border-right:none;border-top:1px solid var(--border);z-index:100;padding:0;background:var(--card)}.side-logo,.side-spacer,.side-foot{display:none}.side-btn{width:25%;height:48px;justify-content:center;padding:0;border-radius:0;font-size:12px;gap:2px;flex-direction:column}.side-btn.act::before{display:none}.main{padding:16px 16px 60px}}
@media print{.sidebar,.hdr{display:none}.qr-i{border:1px dashed #ccc;box-shadow:none}}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<nav class="sidebar">
  <div class="side-logo">收纳<span>管家</span></div>
  <button class="side-btn act" onclick="showP('overview')">🏠 首页</button>
  <button class="side-btn" onclick="showP('admin')">⚙️ 管理</button>
  <button class="side-btn" onclick="showP('qrprint')">🖨️ 二维码</button>
  <button class="side-btn" onclick="showP('settings')">⚡ 设置</button>
  <div class="side-spacer"></div>
  <div class="side-foot">收纳管家 v3</div>
</nav>

<div class="main">
<div id="p-overview" class="page act">
  <div class="hdr"><h1>收纳管家</h1><div class="sub">共 <span id="totalBags">0</span> 袋 · 点击衣物名称查看照片</div></div>
  <div id="overviewC"></div>
</div>

<div id="p-admin" class="page">
  <div class="hdr"><h1>管理</h1><div class="sub">自由管理房间、位置和袋子</div></div>
  <div style="margin-bottom:12px"><button class="btn btn-p" onclick="addRoomF()">+ 添加房间</button></div>
  <div id="adminC"></div>
</div>

<div id="p-qrprint" class="page">
  <div class="hdr"><h1>二维码</h1><div class="sub">打印裁剪后贴袋子上 · 手机扫码直达详情</div></div>
  <button class="btn btn-p" onclick="window.print()" style="margin-bottom:14px">🖨️ 打印全部</button>
  <div id="qrC" class="qr-g"></div>
</div>

<div id="p-settings" class="page">
  <div class="hdr"><h1>设置</h1><div class="sub">数据备份与恢复</div></div>
  <div id="settingsC"></div>
</div>
</div>

<div id="modal" class="md"><div class="mc" id="modalC"></div></div>

<script>
function D(){try{var r=localStorage.getItem('wd');if(r){var o=JSON.parse(r);if(o&&o.rooms&&Array.isArray(o.rooms)&&o.rooms.length>0&&o.rooms[0].n)return o}}catch(e){}return null}
function S(d){localStorage.setItem('wd',JSON.stringify(d))}
var d=D();if(!d){d=JSON.parse(JSON.stringify({"rooms":[{"n":"主卧","sp":[{"n":"衣柜顶部","b":[{"id":1,"l":"","is":[{"n":"羽绒服","c":2,"p":["photo_jacket.jpg"]},{"n":"加绒卫衣","c":3,"p":["photo_pants.jpg"]},{"n":"厚棉袜","c":5,"p":[]},{"n":"围巾","c":2,"p":[]}],"nt":"红色羽绒服+黑色羽绒服"},{"id":2,"l":"","is":[{"n":"秋衣秋裤套装","c":3,"p":[]},{"n":"羊毛衫","c":2,"p":["photo_jacket.jpg"]},{"n":"保暖背心","c":2,"p":[]}],"nt":""}]},{"n":"床底","b":[{"id":3,"l":"","is":[{"n":"厚外套","c":1,"p":["photo_jacket.jpg"]},{"n":"呢子大衣","c":1,"p":["photo_pants.jpg"]},{"n":"皮手套","c":1,"p":[]},{"n":"毛线帽","c":2,"p":[]},{"n":"厚围巾","c":1,"p":[]}],"nt":"厚外套是卡其色的"}]},{"n":"床头柜","b":[{"id":8,"l":"","is":[{"n":"床单","c":3,"p":[]},{"n":"被套","c":2,"p":[]},{"n":"枕头","c":2,"p":[]}],"nt":"备用床上用品"}]}]},{"n":"妞妞房间","sp":[{"n":"床底","b":[{"id":5,"l":"","is":[{"n":"黑色滑雪裤","c":1,"p":["photo_pants.jpg"]},{"n":"黑色外套","c":1,"p":["photo_jacket.jpg"]},{"n":"紫色衣服","c":1,"p":["photo_pants.jpg"]}],"nt":""}]},{"n":"顶部柜子","b":[{"id":6,"l":"","is":[{"n":"夏季短袖","c":4,"p":[]},{"n":"薄款长裤","c":3,"p":[]},{"n":"防晒衣","c":2,"p":[]}],"nt":"夏装暂存"}]},{"n":"床头衣柜","b":[{"id":7,"l":"","is":[{"n":"毛巾被","c":2,"p":[]},{"n":"薄被子","c":1,"p":[]},{"n":"枕套","c":4,"p":[]}],"nt":""}]}]},{"n":"板栗房间","sp":[{"n":"顶部柜子","b":[{"id":4,"l":"","is":[{"n":"黑色冲锋衣","c":1,"p":["photo_jacket.jpg"]}],"nt":"测试照片"}]}]}],"nb":9}));S(d)};

function t(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},2200)}
function showP(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('act')});document.getElementById('p-'+id).classList.add('act');document.querySelectorAll('.side-btn').forEach(function(b,i){b.classList.toggle('act',['overview','admin','qrprint','settings'].indexOf(id)===i)});if(id==='overview')renderO();if(id==='admin')renderA();if(id==='qrprint')renderQ();if(id==='settings')renderS()}
function m(h){document.getElementById('modalC').innerHTML=h;document.getElementById('modal').classList.add('show')}
function cm(){document.getElementById('modal').classList.remove('show')}

// ====== OVERVIEW ======
function renderO(){
  var h='',t=0;
  d.rooms.forEach(function(r,ri){var sb=0;r.sp.forEach(function(s){sb+=s.b.length});t+=sb;
    h+='<div class="r-sec"><div class="r-hdr" onclick="toggleR('+ri+')"><span class="arr o" id="arr-'+ri+'">▶</span> '+r.n+' <span class="c">'+sb+'袋</span></div><div class="r-body" id="rb-'+ri+'">';
    r.sp.forEach(function(s){
      h+='<div class="s-hdr">📍 '+s.n+' · '+s.b.length+'袋</div>';
      s.b.forEach(function(b){var ih='',tot=0;
        b.is.forEach(function(it){tot+=it.c;var hp=it.p&&it.p.length?' 📸':'';ih+='<li><a href="#!" onclick="showBag('+b.id+');return false" style="color:var(--text);text-decoration:none">'+it.n+hp+'</a><span class="c2">x'+it.c+'</span></li>'});
        h+='<div class="card"><div class="cd"><div class="ct"><span class="bg">'+(b.l||'#'+b.id)+'</span><span class="vb" onclick="showBag('+b.id+')">查看→</span></div><div class="dt">共'+tot+'件</div><ul class="il">'+ih+'</ul>'+(b.nt?'<div class="nt">💬 '+b.nt+'</div>':'')+'</div></div>'})});
    h+='</div></div>'});
  document.getElementById('overviewC').innerHTML=h||'<div style="text-align:center;padding:60px 0;color:var(--muted)">暂无数据，去「管理」添加</div>';
  document.getElementById('totalBags').textContent=t
}
function toggleR(ri){var b=document.getElementById('rb-'+ri),a=document.getElementById('arr-'+ri);if(b&&a){b.classList.toggle('cl');a.classList.toggle('o')}}

// ====== ADMIN ======
function renderA(){
  var h='';
  d.rooms.forEach(function(r,ri){
    h+='<div class="adm-s"><div class="adm-rh"><span class="n">'+r.n+'</span><div class="ac">';
    h+='<button class="btn btn-g btn-sm" onclick="addSpotF('+ri+')">+ 位置</button>';
    h+='<button class="btn-ic" onclick="editRoomF('+ri+')" title="修改房间名称">✏️</button>';
    h+='<button class="btn-ic r" onclick="deleteRoom('+ri+')" title="删除房间（含所有位置和袋子）">🗑️</button></div></div>';
    r.sp.forEach(function(s,si){
      h+='<div class="adm-sh"><span class="n">📍 '+s.n+' ('+s.b.length+'袋)</span><div class="ac">';
      h+='<button class="btn btn-g btn-sm" onclick="addBagF('+ri+','+si+')">+ 袋子</button>';
      h+='<button class="btn-ic" onclick="editSpotF('+ri+','+si+')" title="修改位置名称">✏️</button>';
      h+='<button class="btn-ic r" onclick="deleteSpot('+ri+','+si+')" title="删除此位置">🗑️</button></div></div>';
      s.b.forEach(function(b,bi){var its=b.is.map(function(i){return i.n+'x'+i.c}).join(' · ');
        h+='<div class="adm-b"><span><span class="id">'+(b.l||'#'+b.id)+'</span> '+its+'</span><div class="ac">';
        h+='<button class="btn-ic" onclick="showBag('+b.id+')" title="查看袋子详情">👁️</button>';
        h+='<button class="btn-ic" onclick="editBagF('+ri+','+si+','+bi+')" title="编辑袋子">✏️</button>';
        h+='<button class="btn-ic r" onclick="deleteBagC('+ri+','+si+','+bi+')" title="删除袋子">🗑️</button></div></div>'})})});
    h+='</div>'});
  document.getElementById('adminC').innerHTML=h
}

// ====== CRUD ======
function addRoomF(){m('<h2>添加房间</h2><div class="fg"><label>房间名称</label><input id="irn" placeholder="如：主卧、妞妞房间"></div><div class="fr"><button class="btn btn-g" onclick="doAddRoom()">确认添加</button><button class="btn btn-gh" onclick="cm()">取消</button></div>')}
function doAddRoom(){var n=document.getElementById('irn').value.trim();if(!n)return t('请输入房间名称');d.rooms.push({n:n,sp:[]});S(d);cm();renderA();renderO();t('✅ 已添加')}
function editRoomF(ri){m('<h2>修改房间名称</h2><div class="fg"><label>房间名称</label><input id="irn" value="'+d.rooms[ri].n+'"></div><div class="fr"><button class="btn btn-p" onclick="doEditRoom('+ri+')">保存</button><button class="btn btn-gh" onclick="cm()">取消</button></div>')}
function doEditRoom(ri){var n=document.getElementById('irn').value.trim();if(!n)return t('请输入名称');d.rooms[ri].n=n;S(d);cm();renderA();renderO();t('✅ 已更新')}
function deleteRoom(ri){if(!confirm('确定删除「'+d.rooms[ri].n+'」及其所有数据？'))return;d.rooms.splice(ri,1);S(d);renderA();renderO();t('🗑️ 已删除')}
function addSpotF(ri){m('<h2>添加存放位置</h2><div class="fg"><label>位置名称</label><input id="isn" placeholder="如：衣柜顶部、床底"></div><div class="fr"><button class="btn btn-g" onclick="doAddSpot('+ri+')">确认</button><button class="btn btn-gh" onclick="cm()">取消</button></div>')}
function doAddSpot(ri){var n=document.getElementById('isn').value.trim();if(!n)return t('请输入名称');d.rooms[ri].sp.push({n:n,b:[]});S(d);cm();renderA();t('✅ 已添加')}
function editSpotF(ri,si){m('<h2>修改位置名称</h2><div class="fg"><label>位置名称</label><input id="isn" value="'+d.rooms[ri].sp[si].n+'"></div><div class="fr"><button class="btn btn-p" onclick="doEditSpot('+ri+','+si+')">保存</button><button class="btn btn-gh" onclick="cm()">取消</button></div>')}
function doEditSpot(ri,si){var n=document.getElementById('isn').value.trim();if(!n)return t('请输入名称');d.rooms[ri].sp[si].n=n;S(d);cm();renderA();t('✅ 已更新')}
function deleteSpot(ri,si){if(!confirm('确定删除此位置及其所有袋子？'))return;d.rooms[ri].sp.splice(si,1);S(d);renderA();renderO();t('🗑️ 已删除')}
function addBagF(ri,si){m('<h2>添加袋子</h2><div class="fg"><label>编号（可选，留空自动）</label><input id="ibl" placeholder="如：冬季-1"></div><div class="fg"><label>衣物清单（每行一件，名称 x数量）</label><textarea id="ibi" placeholder="羽绒服 x2&#10;毛衣 x3"></textarea></div><div class="fg"><label>备注（可选）</label><input id="ibn"></div><div class="fr"><button class="btn btn-g" onclick="doAddBag('+ri+','+si+')">确认</button><button class="btn btn-gh" onclick="cm()">取消</button></div>')}
function doAddBag(ri,si){var s=document.getElementById('ibi').value.trim(),nt=document.getElementById('ibn').value.trim(),l=document.getElementById('ibl').value.trim();if(!s)return t('请输入清单');var is=[];s.split('\n').forEach(function(ll){ll=ll.trim();if(!ll)return;var m=ll.match(/^(.+?)\s*x\s*(\d+)$/i);if(m)is.push({n:m[1].trim(),c:parseInt(m[2]),p:[]});else is.push({n:ll,c:1,p:[]})});d.rooms[ri].sp[si].b.push({id:d.nb++,l:l,is:is,nt:nt});S(d);cm();renderA();renderO();t('✅ 已添加')}
function editBagF(ri,si,bi){var b=d.rooms[ri].sp[si].b[bi],s=b.is.map(function(i){return i.n+' x'+i.c}).join('\n');m('<h2>编辑袋子</h2><div class="fg"><label>编号</label><input id="ibl" value="'+(b.l||'')+'"></div><div class="fg"><label>衣物清单</label><textarea id="ibi">'+s+'</textarea></div><div class="fg"><label>备注</label><input id="ibn" value="'+(b.nt||'')+'"></div><div class="fr"><button class="btn btn-p" onclick="doEditBag('+ri+','+si+','+bi+')">保存</button><button class="btn btn-gh" onclick="cm()">取消</button></div>')}
function doEditBag(ri,si,bi){var s=document.getElementById('ibi').value.trim(),nt=document.getElementById('ibn').value.trim(),l=document.getElementById('ibl').value.trim();if(!s)return t('请输入清单');var is=[];s.split('\n').forEach(function(ll){ll=ll.trim();if(!ll)return;var m=ll.match(/^(.+?)\s*x\s*(\d+)$/i);if(m)is.push({n:m[1].trim(),c:parseInt(m[2]),p:[]});else is.push({n:ll,c:1,p:[]})});d.rooms[ri].sp[si].b[bi].is=is;d.rooms[ri].sp[si].b[bi].nt=nt;d.rooms[ri].sp[si].b[bi].l=l;S(d);cm();renderA();t('✅ 已更新')}
function deleteBagC(ri,si,bi){var b=d.rooms[ri].sp[si].b[bi];if(!confirm('确定删除「'+(b.l||'#'+b.id)+'」？'))return;d.rooms[ri].sp[si].b.splice(bi,1);S(d);renderA();renderO();t('🗑️ 已删除')}

// ====== BAG DETAIL ======
function showBag(bid){var b=-1;d.rooms.forEach(function(r){r.sp.forEach(function(s){s.b.forEach(function(bb){if(bb.id===bid)b=bb})})});if(!b)return t('找不到袋子');
  var loc='';d.rooms.forEach(function(r){r.sp.forEach(function(s){s.b.forEach(function(bb){if(bb.id===bid)loc=r.n+' › '+s.n})})});
  var ih='',gh='',th='';
  b.is.forEach(function(it,idx){var hp=it.p&&it.p.length>0;
    ih+='<tr><td><a href="#!" style="color:var(--text);text-decoration:none;font-weight:500" onclick="showP('+bid+','+idx+');return false">'+it.n+(hp?' 📸':'')+'</a></td><td style="text-align:center">'+it.c+'</td></tr>';
    if(hp){th+='<a href="#!" onclick="showP('+bid+','+idx+');return false" style="border-radius:6px;overflow:hidden;border:1px solid var(--border);background:var(--card);text-decoration:none;display:block"><img src="'+it.p[0]+'" style="width:100%;aspect-ratio:1;object-fit:cover;display:block"><span style="display:block;text-align:center;font-size:11px;color:#555;padding:3px 0">'+it.n+'</span></a>';
      gh+='<div id="p-'+bid+'-'+idx+'" class="pi"><div style="font-size:13px;font-weight:500;color:var(--accent);margin-bottom:4px">📸 '+it.n+' x'+it.c+'</div><img src="'+it.p[0]+'"><span class="pc" onclick="hideP('+bid+','+idx+')">× 收起</span><span class="pd" onclick="deletePhoto('+bid+','+idx+')">🗑️ 删除</span></div>'}});
  var tot=b.is.reduce(function(a,i){return a+i.c},0);
  m('<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span class="bg">'+(b.l||'#'+b.id)+'</span></div><h2 style="font-size:17px;font-weight:600;color:var(--primary)">🧥 '+(b.l||'袋子')+'内容</h2><div style="font-size:12px;color:var(--muted);margin-bottom:2px">共'+tot+'件 · '+loc+'</div>'+(b.nt?'<div style="font-size:12px;color:var(--muted);font-style:italic;margin-bottom:6px">💬 '+b.nt+'</div>':'')+
  '<table style="width:100%;border-collapse:collapse;margin:10px 0"><tr><th style="text-align:left;padding:6px 4px;border-bottom:2px solid var(--border);font-size:13px;color:var(--muted)">衣物</th><th style="text-align:center;padding:6px 4px;border-bottom:2px solid var(--border);font-size:13px;color:var(--muted)">数量</th></tr>'+ih+'</table>'+
  (th?'<div style="margin-top:10px;padding-top:10px;border-top:2px solid var(--border)"><h3 style="font-size:14px;color:#555;margin-bottom:8px;font-weight:500">📸 衣物照片</h3><div class="pg">'+th+'</div>'+gh+'</div>':'')+
  '<div class="ac" style="margin-top:12px"><button class="btn btn-g btn-sm" onclick="uploadF('+bid+')">📷 添加照片</button></div>'+
  '<div class="fr" style="margin-top:12px"><button class="btn btn-p" onclick="cm()">关闭</button></div>')
}
function showP(bid,idx){document.querySelectorAll('.pi').forEach(function(p){p.classList.remove('show')});var e=document.getElementById('p-'+bid+'-'+idx);if(e){e.classList.add('show');setTimeout(function(){e.scrollIntoView({behavior:'smooth',block:'center'})},100)}}
function hideP(bid,idx){var e=document.getElementById('p-'+bid+'-'+idx);if(e)e.classList.remove('show')}
function deletePhoto(bid,idx){if(!confirm('确定删除这张照片？'))return;d.rooms.forEach(function(r){r.sp.forEach(function(s){s.b.forEach(function(b){if(b.id===bid&&b.is[idx]){b.is[idx].p=[]}})})});S(d);cm();t('🗑️ 已删除');setTimeout(function(){showBag(bid)},300)}
function uploadF(bid){var nh='<input type="file" accept="image/*" id="pf" style="margin-bottom:12px;display:block"><div style="font-size:13px;font-weight:500;color:#555;margin-bottom:6px">关联到哪件衣服？</div>';
  d.rooms.forEach(function(r){r.sp.forEach(function(s){s.b.forEach(function(b){if(b.id===bid)b.is.forEach(function(it,i){nh+='<div class="item-opt" id="io-'+i+'" onclick="selI('+i+')">📸 '+it.n+' x'+it.c+'</div>'})})})});
  nh+='<div class="fr" style="margin-top:12px"><button class="btn btn-g" id="cfBtn" onclick="doUpload('+bid+')" disabled>确认上传</button><button class="btn btn-gh" onclick="cm()">取消</button></div>';
  m('<h2>📷 添加照片</h2>'+nh);window._selI=-1}
function selI(i){document.querySelectorAll('.item-opt').forEach(function(e){e.classList.remove('sel')});document.getElementById('io-'+i).classList.add('sel');window._selI=i;document.getElementById('cfBtn').disabled=false}
function doUpload(bid){var f=document.getElementById('pf').files[0];if(!f)return t('请选择图片');var idx=window._selI;if(idx<0)return t('请选择衣物');
  var r=new FileReader();r.onload=function(e){d.rooms.forEach(function(rr){rr.sp.forEach(function(s){s.b.forEach(function(bb){if(bb.id===bid&&bb.is[idx]){if(!bb.is[idx].p)bb.is[idx].p=[];bb.is[idx].p.push(e.target.result);S(d);cm();t('✅ 照片已添加');setTimeout(function(){showBag(bid)},400)}})})})};r.readAsDataURL(f)}

// ====== QR ======
function renderQ(){var h='',base=window.location.href.split('?')[0].split('#')[0];
  d.rooms.forEach(function(r){r.sp.forEach(function(s){s.b.forEach(function(b){var its=b.is.map(function(i){return i.n+'x'+i.c}).join('、');
    h+='<div class="qr-i"><div id="qr-'+b.id+'" style="display:flex;justify-content:center"></div><div class="ql">'+(b.l||'#'+b.id)+'</div><div class="qs">'+r.n+' › '+s.n+'</div><div style="font-size:10px;color:#666;margin-top:4px">'+its+'</div></div>'})})});
  document.getElementById('qrC').innerHTML=h||'<div style="text-align:center;padding:60px 0;color:var(--muted)">暂无数据</div>';
  d.rooms.forEach(function(r){r.sp.forEach(function(s){s.b.forEach(function(b){var el=document.getElementById('qr-'+b.id);if(el)new QRCode(el,{text:base+'?bag='+b.id,width:100,height:100})})})})}

// ====== SETTINGS ======
function renderS(){document.getElementById('settingsC').innerHTML=
  '<div class="st-c"><div class="t">💾 数据存储</div><div class="d">数据保存在浏览器本地。换设备或清缓存会丢失，建议定期导出备份。</div></div>'+
  '<div class="st-c"><div class="t">📤 导出数据</div><div class="d">下载数据文件用于备份或迁移。</div><button class="btn btn-p btn-sm" onclick="exportD()">📤 导出</button></div>'+
  '<div class="st-c"><div class="t">📥 导入数据</div><div class="d">选择之前导出的文件恢复数据。</div><input type="file" accept=".json" id="if" style="margin-bottom:8px;display:block"><button class="btn btn-g btn-sm" onclick="importD()">📥 导入</button></div>'+
  '<div class="st-c"><div class="t">🔄 重置数据</div><div class="d">恢复初始示例数据。</div><button class="btn btn-r btn-sm" onclick="resetD()">⚠️ 重置</button></div>'+
  '<div class="st-c"><div class="t">📋 关于</div><div class="d">收纳管家 v3 · 灵感来自 DeepSeek</div></div>'}
function exportD(){var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='wardrobe_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);t('✅ 已导出')}
function importD(){var f=document.getElementById('if').files[0];if(!f)return t('请选择文件');var r=new FileReader();r.onload=function(e){try{var dd=JSON.parse(e.target.result);if(!dd.rooms)return t('格式不对');if(!confirm('导入将覆盖当前数据，确定？'))return;d=dd;S(d);t('✅ 已导入');renderO();renderA()}catch(e){t('❌ 解析失败')}};r.readAsText(f)}
function resetD(){if(!confirm('确定恢复示例数据？'))return;d=JSON.parse(JSON.stringify({"rooms":[{"n":"主卧","sp":[{"n":"衣柜顶部","b":[{"id":1,"l":"","is":[{"n":"羽绒服","c":2,"p":["photo_jacket.jpg"]},{"n":"加绒卫衣","c":3,"p":["photo_pants.jpg"]},{"n":"厚棉袜","c":5,"p":[]},{"n":"围巾","c":2,"p":[]}],"nt":"红色羽绒服+黑色羽绒服"},{"id":2,"l":"","is":[{"n":"秋衣秋裤套装","c":3,"p":[]},{"n":"羊毛衫","c":2,"p":["photo_jacket.jpg"]},{"n":"保暖背心","c":2,"p":[]}],"nt":""}]},{"n":"床底","b":[{"id":3,"l":"","is":[{"n":"厚外套","c":1,"p":["photo_jacket.jpg"]},{"n":"呢子大衣","c":1,"p":["photo_pants.jpg"]},{"n":"皮手套","c":1,"p":[]},{"n":"毛线帽","c":2,"p":[]},{"n":"厚围巾","c":1,"p":[]}],"nt":"厚外套是卡其色的"}]},{"n":"床头柜","b":[{"id":8,"l":"","is":[{"n":"床单","c":3,"p":[]},{"n":"被套","c":2,"p":[]},{"n":"枕头","c":2,"p":[]}],"nt":"备用床上用品"}]}]},{"n":"妞妞房间","sp":[{"n":"床底","b":[{"id":5,"l":"","is":[{"n":"黑色滑雪裤","c":1,"p":["photo_pants.jpg"]},{"n":"黑色外套","c":1,"p":["photo_jacket.jpg"]},{"n":"紫色衣服","c":1,"p":["photo_pants.jpg"]}],"nt":""}]},{"n":"顶部柜子","b":[{"id":6,"l":"","is":[{"n":"夏季短袖","c":4,"p":[]},{"n":"薄款长裤","c":3,"p":[]},{"n":"防晒衣","c":2,"p":[]}],"nt":"夏装暂存"}]},{"n":"床头衣柜","b":[{"id":7,"l":"","is":[{"n":"毛巾被","c":2,"p":[]},{"n":"薄被子","c":1,"p":[]},{"n":"枕套","c":4,"p":[]}],"nt":""}]}]},{"n":"板栗房间","sp":[{"n":"顶部柜子","b":[{"id":4,"l":"","is":[{"n":"黑色冲锋衣","c":1,"p":["photo_jacket.jpg"]}],"nt":"测试照片"}]}]}],"nb":9}));S(d);t('✅ 已重置');renderO();renderA()}

// ====== QR SCAN ======
(function(){var p=new URLSearchParams(window.location.search),id=parseInt(p.get('bag'));if(id){var f=false;d.rooms.forEach(function(r){r.sp.forEach(function(s){s.b.forEach(function(b){if(b.id===id){f=true}})})});if(f)setTimeout(function(){showBag(id)},500)}})();

renderO();
// 强制浅色
(function(){document.documentElement.style.background='#f8f9fa';document.body.style.background='#f8f9fa'})();
</script>
